name: libredex
description: "LibreDex is a free Pokémon reference and team-planning app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.3.1
  dio: ^5.4.3
  drift: ^2.16.0
  flutter_cache_manager: ^3.4.1
  flutter_riverpod: ^3.1.0
  path: ^1.9.0
  path_provider: ^2.1.2
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  custom_lint: ^0.8.1
  drift_dev: ^2.16.0
  flutter_lints: ^6.0.0
  http: ^1.2.1
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0

dependency_overrides:
  path_provider_android: 2.2.23
  path_provider_foundation: 2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/
